name: Build and Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Autorise la publication sur GitHub Pages et le registre Docker de GitHub (GHCR)
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

# Permet d'éviter que plusieurs déploiements se marchent dessus
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build site
        run: python -m mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Build Docker image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/f-100d-manual
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker build -t $IMAGE_ID:latest .

      - name: Login to ghcr.io
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Push to ghcr.io
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/f-100d-manual
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker push $IMAGE_ID:latest
      
      - name: Delete older versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'f-100d-manual'
          package-type: 'container'
          min-versions-to-keep: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
